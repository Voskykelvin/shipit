databases:
  - name: shipit-db
    databaseName: shipit
    user: shipit
    plan: basic-256mb
    region: singapore
    ipAllowList: []
    postgresMajorVersion: "16"

services:
  - type: keyvalue
    name: redis
    plan: starter
    region: singapore
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: web
    name: api
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./docker/Dockerfile.api
    dockerContext: .
    healthCheckPath: /api/health/ready
    preDeployCommand: npm run db:migrate:deploy --workspace=@shipit/database
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: DATABASE_URL
        fromDatabase:
          name: shipit-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: redis
          property: connectionString
      - key: MPESA_ENV
        value: sandbox
      - key: SHIPIT_ADMIN_EMAIL
        sync: false
      - key: SHIPIT_ADMIN_PASSWORD
        sync: false
      - key: SHIPIT_ADMIN_PHONE
        sync: false
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_INITIATOR_NAME
        sync: false
      - key: MPESA_B2C_SECURITY_CREDENTIAL
        sync: false
      - key: MPESA_CALLBACK_URL
        sync: false
      - key: MPESA_CALLBACK_TOKEN
        sync: false
      - key: AFRICASTALKING_API_KEY
        sync: false
      - key: AFRICASTALKING_USERNAME
        sync: false
      - key: AFRICASTALKING_SENDER_ID
        sync: false
      - key: WHATSAPP_API_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_ID
        sync: false

  - type: worker
    name: worker
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./docker/Dockerfile.worker
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: shipit-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: redis
          property: connectionString
      - key: SHIPIT_EVENTS_WEBHOOK_URL
        sync: false
      - key: SHIPIT_EVENTS_WEBHOOK_TOKEN
        sync: false

  - type: web
    name: web
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./docker/Dockerfile.web
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "80"
