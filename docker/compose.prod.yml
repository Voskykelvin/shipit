services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shipit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password must be set}
      POSTGRES_DB: ${POSTGRES_DB:-shipit}
    volumes:
      - shipit_postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shipit} -d ${POSTGRES_DB:-shipit}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shipit-internal

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-shipitredisauth}
    volumes:
      - shipit_redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-shipitredisauth}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shipit-internal

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-shipit}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-shipit}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-shipitredisauth}@redis:6379
      CORS_ORIGINS: ${CORS_ORIGINS:-https://shipit.co.ke,https://app.shipit.co.ke,https://merchant.shipit.co.ke,https://rider.shipit.co.ke}
      MPESA_ENV: ${MPESA_ENV:-production}
      MPESA_CONSUMER_KEY: ${MPESA_CONSUMER_KEY:-}
      MPESA_CONSUMER_SECRET: ${MPESA_CONSUMER_SECRET:-}
      MPESA_SHORTCODE: ${MPESA_SHORTCODE:-}
      MPESA_PASSKEY: ${MPESA_PASSKEY:-}
      MPESA_INITIATOR_NAME: ${MPESA_INITIATOR_NAME:-}
      MPESA_B2C_SECURITY_CREDENTIAL: ${MPESA_B2C_SECURITY_CREDENTIAL:-}
      MPESA_CALLBACK_URL: ${MPESA_CALLBACK_URL:-}
      MPESA_CALLBACK_TOKEN: ${MPESA_CALLBACK_TOKEN:-}
      AFRICASTALKING_API_KEY: ${AFRICASTALKING_API_KEY:-}
      AFRICASTALKING_USERNAME: ${AFRICASTALKING_USERNAME:-}
      AFRICASTALKING_SENDER_ID: ${AFRICASTALKING_SENDER_ID:-}
      WHATSAPP_API_TOKEN: ${WHATSAPP_API_TOKEN:-}
      WHATSAPP_PHONE_ID: ${WHATSAPP_PHONE_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - shipit-internal

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-shipit}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-shipit}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-shipitredisauth}@redis:6379
      SHIPIT_EVENTS_WEBHOOK_URL: ${SHIPIT_EVENTS_WEBHOOK_URL:-}
      SHIPIT_EVENTS_WEBHOOK_TOKEN: ${SHIPIT_EVENTS_WEBHOOK_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - shipit-internal

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - api
    networks:
      - shipit-internal

volumes:
  shipit_postgres_prod_data:
  shipit_redis_prod_data:

networks:
  shipit-internal:
    driver: bridge
