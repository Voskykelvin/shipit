events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Upstream API
    upstream backend_api {
        server api:4000;
        keepalive 32;
    }

    # Main Gateway Server
    server {
        listen 80;
        server_name localhost;

        # API Reverse Proxy
        location /api/ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # Real-time SSE Stream (Zero buffering)
        location /api/events/stream {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            proxy_read_timeout 24h;
        }

        # Staff Portal: /staff/
        location ^~ /staff/ {
            alias /usr/share/nginx/html/staff/;
            try_files $uri $uri/ /staff/index.html;
            expires 1d;
            add_header Cache-Control "public, max-age=86400";
        }

        # Merchant Portal: /merchant/
        location ^~ /merchant/ {
            alias /usr/share/nginx/html/merchant/;
            try_files $uri $uri/ /merchant/index.html;
            expires 1d;
            add_header Cache-Control "public, max-age=86400";
        }

        # Rider PWA: /rider/
        location ^~ /rider/ {
            alias /usr/share/nginx/html/rider/;
            try_files $uri $uri/ /rider/index.html;
            expires 1d;
            add_header Cache-Control "public, max-age=86400";
        }

        # Public Website (Default root): /
        location / {
            root /usr/share/nginx/html/website;
            try_files $uri $uri/ /index.html;
            expires 1d;
            add_header Cache-Control "public, max-age=86400";
        }

        # Static asset caching
        location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
            root /usr/share/nginx/html/website;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }
}
